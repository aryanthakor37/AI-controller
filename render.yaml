services:
  # Backend Node.js Service
  - type: web
    name: aimobile-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        value: "https://aimobile-frontend.onrender.com"

  # Frontend React (Vite) Service
  - type: web
    name: aimobile-frontend
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: "https://aimobile-backend.onrender.com/api"
      - key: VITE_SOCKET_URL
        value: "https://aimobile-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
